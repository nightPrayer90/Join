<section class="login-page" [class.is-ready]="!showSplash()">
  <div class="splash-screen">
    <div class="splash-track">
      <img src="assets/logos/join-logo-dark.png" alt="Join" class="splash-logo">
    </div>
  </div>

  <div class="login-shell">
    <header class="top-bar">
      <a class="logo-link" routerLink="/login" aria-label="Join login">
        <img src="assets/logos/join-logo-dark.png" alt="Join" class="logo">
      </a>

      <div class="signup-desktop">
        <span>Not a Join user?</span>
        <a class="signup-link" routerLink="/signup">Sign up</a>
      </div>
    </header>

    <main class="login-content">
      <article class="login-card">
        <h1>Log in</h1>
        <div class="headline-separator"></div>

        <form class="login-form" novalidate (ngSubmit)="onSubmit()">
          <div class="input-wrapper" [class.has-error]="emailError || loginError">
            <input
              id="email"
              name="email"
              type="email"
              placeholder="Email"
              autocomplete="email"
              [(ngModel)]="email"
              (input)="onEmailInput()"
              [attr.aria-invalid]="!!emailError || loginError">
            <img src="assets/icons/mail.png" alt="" aria-hidden="true" class="input-icon">
          </div>
          @if (emailError) {
            <p class="field-error">{{ emailError }}</p>
          }

          <div class="input-wrapper" [class.has-error]="passwordError || loginError">
            <input
              id="password"
              name="password"
              [type]="passwordVisible ? 'text' : 'password'"
              placeholder="Password"
              autocomplete="current-password"
              [(ngModel)]="password"
              (input)="onPasswordInput()"
              (focus)="onPasswordFocus()"
              (blur)="onPasswordBlur()"
              [attr.aria-invalid]="!!passwordError || loginError">
            @if (passwordFocused) {
              <button
                type="button"
                class="password-toggle"
                [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
                (mousedown)="$event.preventDefault()"
                (click)="togglePasswordVisibility()">
                <img [src]="passwordVisible ? 'assets/icons/eye.svg' : 'assets/icons/eye-off.svg'" alt="" aria-hidden="true">
              </button>
            } @else {
              <img src="assets/icons/lock.png" alt="" aria-hidden="true" class="input-icon">
            }
          </div>
          @if (passwordError) {
            <p class="field-error">{{ passwordError }}</p>
          }

          @if (errorMessage) {
            <p class="form-error">{{ errorMessage }}</p>
          }

          <div class="action-buttons">
            <button type="submit" class="btn-primary" [disabled]="isLoading">
              {{ isLoading ? 'Loading...' : 'Log in' }}
            </button>
            <button type="button" class="btn-secondary" [disabled]="isLoading" (click)="onGuestLogin()">Guest Log in</button>
          </div>
        </form>
      </article>
    </main>

    <div class="signup-mobile">
      <span>Not a Join user?</span>
      <a class="signup-link" routerLink="/signup">Sign up</a>
    </div>

    <footer class="login-footer">
      <a routerLink="/privacy-policy">Privacy Policy</a>
      <a routerLink="/legal-notice">Legal Notice</a>
    </footer>

    <div class="login-toast" [class.show]="showToast()" aria-hidden="true">
      You logged in successfully
    </div>
  </div>
</section>
