<section class="dialog-overlay">
  <article class="dialog-card">
    <aside class="dialog-left">
      <img src="assets/logos/join-logo.png" alt="Join Logo" class="dialog-logo">
      <h2>Add contact</h2>
      <p>Tasks are better with a team!</p>
      <span class="left-divider" aria-hidden="true"></span>
    </aside>

    <div class="dialog-right">
      <button type="button" class="close-btn" aria-label="Close dialog">×</button>

      <div class="dialog-content">
        <div class="avatar-placeholder">
          <img src="assets/icons/person.png" alt="" aria-hidden="true">
        </div>

        <form class="dialog-form" novalidate (ngSubmit)="onSubmit()">
          <div class="input-wrapper" [class.has-error]="fullNameError">
            <input
              type="text"
              name="fullName"
              placeholder="Name"
              [(ngModel)]="fullName"
              (input)="onFullNameInput()">
            <img src="assets/icons/person.png" alt="" aria-hidden="true" class="input-icon">
          </div>
          @if (fullNameError) {
            <p class="field-error">{{ fullNameError }}</p>
          }

          <div class="input-wrapper" [class.has-error]="emailError">
            <input
              type="email"
              name="email"
              placeholder="Email"
              [(ngModel)]="email"
              (input)="onEmailInput()">
            <img src="assets/icons/mail.png" alt="" aria-hidden="true" class="input-icon">
          </div>
          @if (emailError) {
            <p class="field-error">{{ emailError }}</p>
          }

          <div class="input-wrapper" [class.has-error]="phoneError">
            <input
              type="text"
              name="phone"
              placeholder="Phone"
              [(ngModel)]="phone"
              (input)="onPhoneInput()">
            <img src="assets/icons/call.svg" alt="" aria-hidden="true" class="input-icon phone-icon">
          </div>
          @if (phoneError) {
            <p class="field-error">{{ phoneError }}</p>
          }

          @if (submitError) {
            <p class="form-error">{{ submitError }}</p>
          }

          <div class="dialog-actions">
            <button type="button" class="btn-secondary cancel-btn">
              <span>Cancel</span>
              <span class="action-icon">×</span>
            </button>

            <button type="submit" class="btn-primary create-btn" [disabled]="isSaving">
              <span>{{ isSaving ? 'Creating...' : 'Create contact' }}</span>
              <span class="action-icon">✓</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </article>
</section>
