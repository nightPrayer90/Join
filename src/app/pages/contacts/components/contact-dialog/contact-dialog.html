<section class="dialog-overlay">
  <article class="dialog-card">
    <aside class="dialog-left">
      <img src="assets/logos/join-logo.png" alt="Join Logo" class="dialog-logo">
      <h2>Add contact</h2>
      <p>Tasks are better with a team!</p>
      <span class="left-divider" aria-hidden="true"></span>
    </aside>

    <div class="dialog-right">
      <button type="button" class="close-btn" aria-label="Close dialog">×</button>

      <div class="dialog-content">
        <div class="avatar-placeholder">
          <img src="assets/icons/person.png" alt="" aria-hidden="true">
        </div>

        <div class="dialog-form">
          <div class="input-wrapper">
            <input type="text" placeholder="Name">
            <img src="assets/icons/person.png" alt="" aria-hidden="true" class="input-icon">
          </div>

          <div class="input-wrapper">
            <input type="email" placeholder="Email">
            <img src="assets/icons/mail.png" alt="" aria-hidden="true" class="input-icon">
          </div>

          <div class="input-wrapper">
            <input type="text" placeholder="Phone">
            <img src="assets/icons/call.svg" alt="" aria-hidden="true" class="input-icon phone-icon">
          </div>

          <div class="dialog-actions">
            <button type="button" class="btn-secondary cancel-btn">
              <span>Cancel</span>
              <span class="action-icon">×</span>
            </button>

            <button type="button" class="btn-primary create-btn">
              <span>Create contact</span>
              <span class="action-icon">✓</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </article>
</section>
