<section class="add-task-page" aria-label="Add task page">
  <div class="add-task-container">
    <h1>Add Task</h1>

    <form class="task-form" novalidate>
      <div class="form-columns">
        <div class="form-left">
          <label class="field-label" for="task-title">Title<span class="required">*</span></label>
          <input id="task-title" type="text" placeholder="Enter a title">

          <label class="field-label" for="task-description">Description</label>
          <textarea id="task-description" placeholder="Enter a Description"></textarea>

          <label class="field-label" for="task-due-date">Due date<span class="required">*</span></label>
          <div class="input-with-icon">
            <input id="task-due-date" type="text" placeholder="dd/mm/yyyy">
            <button type="button" class="field-icon-btn" aria-label="Choose date">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M7 2C7.55228 2 8 2.44772 8 3V4H16V3C16 2.44772 16.4477 2 17 2C17.5523 2 18 2.44772 18 3V4H19C20.6569 4 22 5.34315 22 7V19C22 20.6569 20.6569 22 19 22H5C3.34315 22 2 20.6569 2 19V7C2 5.34315 3.34315 4 5 4H6V3C6 2.44772 6.44772 2 7 2Z" fill="#2A3647"/>
                <path d="M4 10H20V19C20 19.5523 19.5523 20 19 20H5C4.44772 20 4 19.5523 4 19V10Z" fill="#F6F7F8"/>
                <rect x="7" y="13" width="3" height="3" rx="1" fill="#2A3647"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-divider" aria-hidden="true"></div>

        <div class="form-right">
          <p class="field-label">Priority</p>
          <div class="priority-row" role="group" aria-label="Select priority">
            <label class="priority-option">
              <input type="radio" name="priority" value="urgent">
              <span class="priority-btn priority-btn--urgent">
                <span>Urgent</span>
                <span class="priority-icon" aria-hidden="true">
                  <svg width="20" height="15" viewBox="0 0 20 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#urgent-clip)">
                      <path d="M18.9043 14.5096C18.6696 14.51 18.4411 14.4351 18.2522 14.2961L10.0001 8.21288L1.74809 14.2961C1.63224 14.3816 1.50066 14.4435 1.36086 14.4783C1.22106 14.513 1.07577 14.5199 0.933305 14.4986C0.790837 14.4772 0.653973 14.428 0.530528 14.3538C0.407083 14.2796 0.299474 14.1818 0.213845 14.0661C0.128216 13.9503 0.0662437 13.8188 0.0314671 13.6791C-0.00330956 13.5394 -0.0102098 13.3943 0.0111604 13.2519C0.0543195 12.9644 0.21001 12.7058 0.443982 12.533L9.34809 5.96249C9.53679 5.8229 9.76536 5.74756 10.0001 5.74756C10.2349 5.74756 10.4635 5.8229 10.6522 5.96249L19.5563 12.533C19.7422 12.6699 19.8801 12.862 19.9503 13.0819C20.0204 13.3018 20.0193 13.5382 19.9469 13.7573C19.8746 13.9765 19.7349 14.1673 19.5476 14.3024C19.3604 14.4375 19.1352 14.51 18.9043 14.5096Z" fill="currentColor"/>
                      <path d="M18.9043 8.76057C18.6696 8.76097 18.4411 8.68612 18.2522 8.54702L10.0002 2.46386L1.7481 8.54702C1.51412 8.71983 1.22104 8.79269 0.93331 8.74956C0.645583 8.70643 0.386785 8.55086 0.213849 8.31706C0.0409137 8.08326 -0.0319941 7.79039 0.011165 7.50288C0.054324 7.21536 0.210015 6.95676 0.443986 6.78395L9.3481 0.213471C9.5368 0.0738799 9.76537 -0.00146484 10.0002 -0.00146484C10.2349 -0.00146484 10.4635 0.0738799 10.6522 0.213471L19.5563 6.78395C19.7422 6.92087 19.8801 7.11298 19.9503 7.33286C20.0204 7.55274 20.0193 7.78914 19.947 8.00832C19.8746 8.22751 19.7349 8.41826 19.5476 8.55335C19.3604 8.68844 19.1352 8.76096 18.9043 8.76057Z" fill="currentColor"/>
                    </g>
                    <defs>
                      <clipPath id="urgent-clip">
                        <rect width="20" height="14.5098" fill="white"/>
                      </clipPath>
                    </defs>
                  </svg>
                </span>
              </span>
            </label>

            <label class="priority-option">
              <input type="radio" name="priority" value="medium" checked>
              <span class="priority-btn priority-btn--medium">
                <span>Medium</span>
                <span class="priority-icon" aria-hidden="true">
                  <svg width="20" height="8" viewBox="0 0 20 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.9041 7.45086H1.09589C0.805242 7.45086 0.526498 7.33456 0.320979 7.12755C0.11546 6.92054 0 6.63977 0 6.34701C0 6.05425 0.11546 5.77349 0.320979 5.56647C0.526498 5.35946 0.805242 5.24316 1.09589 5.24316H18.9041C19.1948 5.24316 19.4735 5.35946 19.679 5.56647C19.8845 5.77349 20 6.05425 20 6.34701C20 6.63977 19.8845 6.92054 19.679 7.12755C19.4735 7.33456 19.1948 7.45086 18.9041 7.45086Z" fill="currentColor"/>
                    <path d="M18.9041 2.2077H1.09589C0.805242 2.2077 0.526498 2.0914 0.320979 1.88439C0.11546 1.67738 0 1.39661 0 1.10385C0 0.81109 0.11546 0.530322 0.320979 0.32331C0.526498 0.116298 0.805242 0 1.09589 0L18.9041 0C19.1948 0 19.4735 0.116298 19.679 0.32331C19.8845 0.530322 20 0.81109 20 1.10385C20 1.39661 19.8845 1.67738 19.679 1.88439C19.4735 2.0914 19.1948 2.2077 18.9041 2.2077Z" fill="currentColor"/>
                  </svg>
                </span>
              </span>
            </label>

            <label class="priority-option">
              <input type="radio" name="priority" value="low">
              <span class="priority-btn priority-btn--low">
                <span>Low</span>
                <span class="priority-icon" aria-hidden="true">
                  <svg width="20" height="15" viewBox="0 0 20 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 8.76077C9.7654 8.76118 9.53687 8.68634 9.34802 8.54726L0.444913 1.97752C0.329075 1.89197 0.231235 1.78445 0.15698 1.66111C0.0827245 1.53777 0.033508 1.40102 0.0121402 1.25868C-0.031014 0.971193 0.0418855 0.678356 0.214802 0.444584C0.387718 0.210811 0.646486 0.0552534 0.934181 0.0121312C1.22188 -0.0309911 1.51493 0.0418545 1.74888 0.214643L10 6.29712L18.2511 0.214643C18.367 0.129087 18.4985 0.0671675 18.6383 0.0324205C18.7781 -0.00232646 18.9234 -0.00922079 19.0658 0.0121312C19.2083 0.0334832 19.3451 0.0826633 19.4685 0.156864C19.592 0.231064 19.6996 0.328831 19.7852 0.444584C19.8708 0.560336 19.9328 0.691806 19.9676 0.831488C20.0023 0.97117 20.0092 1.11633 19.9879 1.25868C19.9665 1.40102 19.9173 1.53777 19.843 1.66111C19.7688 1.78445 19.6709 1.89197 19.5551 1.97752L10.652 8.54726C10.4631 8.68634 10.2346 8.76118 10 8.76077Z" fill="currentColor"/>
                    <path d="M10 14.5093C9.7654 14.5097 9.53687 14.4349 9.34802 14.2958L0.444913 7.72606C0.210967 7.55327 0.0552944 7.29469 0.0121402 7.00721C-0.031014 6.71973 0.0418855 6.42689 0.214802 6.19312C0.387718 5.95935 0.646486 5.80379 0.934181 5.76067C1.22188 5.71754 1.51493 5.79039 1.74888 5.96318L10 12.0457L18.2511 5.96318C18.4851 5.79039 18.7781 5.71754 19.0658 5.76067C19.3535 5.80379 19.6123 5.95935 19.7852 6.19312C19.9581 6.42689 20.031 6.71973 19.9879 7.00721C19.9447 7.29469 19.789 7.55327 19.5551 7.72606L10.652 14.2958C10.4631 14.4349 10.2346 14.5097 10 14.5093Z" fill="currentColor"/>
                  </svg>
                </span>
              </span>
            </label>
          </div>

          <label class="field-label" for="assigned-to">Assigned to</label>
          <div class="select-field">
            <input id="assigned-to" type="text" value="Select contacts to assign" readonly>
            <span class="select-arrow" aria-hidden="true">▾</span>
          </div>

          <label class="field-label" for="category">Category<span class="required">*</span></label>
          <div class="select-field">
            <input id="category" type="text" value="Select task category" readonly>
            <span class="select-arrow" aria-hidden="true">▾</span>
          </div>

          <label class="field-label" for="subtasks">Subtasks</label>
          <input id="subtasks" type="text" placeholder="Add new subtask">
        </div>
      </div>

      <div class="form-footer">
        <p class="required-note"><span class="required">*</span>This field is required</p>

        <div class="footer-actions">
          <button type="button" class="btn-secondary task-btn-secondary">
            <span>Clear</span>
            <span class="btn-close" aria-hidden="true">×</span>
          </button>

          <button type="button" class="btn-primary task-btn-primary">
            <span>Create Task</span>
            <span class="btn-check" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>
    </form>

    <div class="task-toast" aria-hidden="true">
      <span>Task added to board</span>
      <span class="toast-icon" aria-hidden="true">▥</span>
    </div>
  </div>
</section>
