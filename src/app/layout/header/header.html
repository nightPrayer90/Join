<header class="header">
  <div class="header__inner">
    <img class="title-logo" src="assets/logos/join-logo-dark.png" alt="Join">
    <span class="title">Kanban Project Management Tool</span>

    <div class="actions">
      <a routerLink="/help" routerLinkActive="is-active" class="help-btn" aria-label="Help">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M9.5 9.2a2.5 2.5 0 1 1 3.8 2.1c-.9.5-1.3 1-1.3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          <circle cx="12" cy="17" r="1" fill="currentColor" />
        </svg>
      </a>

      <div class="avatar-wrapper">
        <button
          type="button"
          class="avatar"
          [attr.aria-label]="'User ' + avatarLabel()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-haspopup="menu"
          (click)="toggleMenu($event)"
        >
          {{ avatarLabel() }}
        </button>

        @if (isMenuOpen()) {
          <div class="menu" role="menu">
            <a class="menu-item" role="menuitem" routerLink="/legal-notice" routerLinkActive="is-active" (click)="closeMenu()">Legal Notice</a>
            <a class="menu-item" role="menuitem" routerLink="/privacy-policy" routerLinkActive="is-active" (click)="closeMenu()">Privacy Policy</a>
            <button type="button" class="menu-item menu-button" role="menuitem" (click)="logout()">Log out</button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
